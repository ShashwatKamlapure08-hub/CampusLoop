<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — CampusLoop</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-wrap">

      <div class="auth-brand">
        <div class="auth-brand-mark">CL</div>
        <div class="auth-brand-name">CampusLoop</div>
      </div>

      <div class="auth-card">
        <div class="auth-card-tag">
          <span>ISSUE&nbsp;&nbsp;NEW&nbsp;MEMBER</span>
          <span class="stamp">CAMPUS ID</span>
        </div>

        <div class="auth-card-body">
          <h1 class="auth-heading">Create your account</h1>
          <span class="auth-subheading">Sign up with your college email to start lending and borrowing.</span>

          <div id="register-banner" class="banner" role="alert"></div>

          <form id="register-form" novalidate>
            <div class="field">
              <label for="register-name">Full name</label>
              <input
                type="text"
                id="register-name"
                name="name"
                placeholder="Jane Doe"
                autocomplete="name"
                required
              />
            </div>

            <div class="field">
              <label for="register-email">College email</label>
              <input
                type="email"
                id="register-email"
                name="email"
                placeholder="you@college.edu"
                autocomplete="email"
                required
              />
              <span class="field-hint">Must be a valid college domain email.</span>
            </div>

            <div class="field">
              <label for="register-password">Password</label>
              <input
                type="password"
                id="register-password"
                name="password"
                placeholder="At least 6 characters"
                autocomplete="new-password"
                required
              />
            </div>

            <div class="field">
              <label for="register-confirm-password">Confirm password</label>
              <input
                type="password"
                id="register-confirm-password"
                name="confirmPassword"
                placeholder="••••••••"
                autocomplete="new-password"
                required
              />
            </div>

            <button type="submit" id="register-submit" class="btn btn-primary">Create account</button>
          </form>

          <div class="auth-footer-link">
            Already have an account? <a href="login.html">Log in</a>
          </div>
        </div>
      </div>

      <div class="auth-legal">
        Access is restricted to verified college email addresses.
      </div>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
