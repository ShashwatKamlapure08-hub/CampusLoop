<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — CampusLoop</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-wrap">

      <div class="auth-brand">
        <div class="auth-brand-mark">CL</div>
        <div class="auth-brand-name">CampusLoop</div>
      </div>

      <div class="auth-card">
        <div class="auth-card-tag">
          <span>ISSUE&nbsp;&nbsp;LOG-IN</span>
          <span class="stamp">CAMPUS ID</span>
        </div>

        <div class="auth-card-body">
          <h1 class="auth-heading">Welcome back</h1>
          <span class="auth-subheading">Log in with your college email to borrow or lend an item.</span>

          <div id="login-banner" class="banner" role="alert"></div>

          <form id="login-form" novalidate>
            <div class="field">
              <label for="login-email">College email</label>
              <input
                type="email"
                id="login-email"
                name="email"
                placeholder="you@college.edu"
                autocomplete="email"
                required
              />
            </div>

            <div class="field">
              <label for="login-password">Password</label>
              <input
                type="password"
                id="login-password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
            </div>

            <button type="submit" id="login-submit" class="btn btn-primary">Log in</button>
          </form>

          <div class="auth-footer-link">
            New to CampusLoop? <a href="register.html">Create an account</a>
          </div>
        </div>
      </div>

      <div class="auth-legal">
        Access is restricted to verified college email addresses.
      </div>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
